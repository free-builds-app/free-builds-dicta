          background-color: #ccc;
          transition: .4s;
          border-radius: 34px;
        }
        .slider:before {
          position: absolute;
          content: "";
          height: 16px;
          width: 16px;
          left: 4px;
          bottom: 4px;
          background-color: white;
          transition: .4s;
          border-radius: 50%;
        }
        input:checked + .slider {
          background-color: #3b82f6;
        }
        input:checked + .slider:before {
          transform: translateX(26px);
        }
        .active-chunk {
            background-color: #fef08a;
            color: #1e3a8a;
            border-radius: 4px;
            padding: 2px 4px;
            font-weight: 600;
        }
        .dark .active-chunk {
            background-color: #854d0e;
            color: #fef08a;
        }
        textarea::placeholder {
            color: #9ca3af;
            font-style: italic;
        }
        .dark textarea::placeholder {
            color: #4b5563;
        }
        
        /* Ajuste para que la columna derecha tenga scroll interno si hay muchos bloques */
        .scrollable-panel {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
    </style>
</head>

                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Palabras por Bloque</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="cfgWords" min="1" max="15" value="4" class="w-full" oninput="document.getElementById('wordsVal').innerText = this.value">
                                    <span id="wordsVal" class="font-mono bg-gray-100 dark:bg-dark-bg px-2 py-1 rounded">4</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Repeticiones</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" id="cfgRepeats" min="1" max="5" value="2" class="w-full" oninput="document.getElementById('repeatsVal').innerText = this.value">
                                    <span id="repeatsVal" class="font-mono bg-gray-100 dark:bg-dark-bg px-2 py-1 rounded">2</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1 text-blue-600 dark:text-blue-400">Pausa / Frases (seg)</label>
                                <input type="number" id="cfgPauseSentence" min="0" max="10" value="2" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-dark-bg dark:border-dark-border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1 text-purple-600 dark:text-purple-400">Pausa / Palabras (seg)</label>
                                <input type="number" id="cfgPauseWord" min="0" max="5" step="0.1" value="0.2" class="w-full p-2 border rounded-lg bg-gray-50 dark:bg-dark-bg dark:border-dark-border">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Área de Trabajo -->
                <div class="bg-white dark:bg-dark-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-dark-border">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                        <h2 class="text-xl font-bold">Texto Original</h2>
                        <div class="flex gap-2">
                            <button id="btnProcess" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors w-full sm:w-auto">
                                1. Procesar Texto
                            </button>
                            <button id="btnPause" class="hidden bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                                Pausar
                            </button>
                            <button id="btnStop" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                                Detener
                            </button>
                        </div>
                    </div>
                    <!-- Se aumentó la altura del textarea a h-64 para aprovechar más el espacio -->
                    <textarea id="inputText" class="w-full h-64 p-4 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 dark:bg-dark-bg dark:border-dark-border resize-y" placeholder="Introduce tu texto aquí..."></textarea>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Vista de Reproducción -->
            <div id="playbackView" class="hidden bg-white dark:bg-dark-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-dark-border scrollable-panel">
                <h2 class="text-xl font-bold mb-4 sticky top-0 bg-white dark:bg-dark-card py-2 z-10 border-b border-gray-100 dark:border-dark-border">Bloques de Dictado (Haz clic para reproducir)</h2>
                <div id="chunksContainer" class="grid gap-3"></div>
            </div>

        </div>
    </div>

    <script>
        // --- Lógica del Tema Oscuro ---
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                htmlElement.classList.add('dark');
                themeLabel.innerText = "MODO OSCURO";
            } else {
                htmlElement.classList.remove('dark');
                themeLabel.innerText = "MODO CLARO";
            }
        });

        // --- Motor de Dictado ---
        const synth = window.speechSynthesis;
        let voices = [];
        let chunks = [];
        let isPlaying = false;
        let isPaused = false;
        let currentChunkIndex = 0;
        let currentRepeat = 0;
        let globalTimer = null;

        // Cargar voces
        function populateVoiceList() {
            voices = synth.getVoices();
            const voiceSelect = document.getElementById('voiceSelect');
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = i;
                voiceSelect.appendChild(option);
            });
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // Analizador Léxico (Tokenizer)
        function tokenize(text) {
            const regex = /([.,:;!?()"'\n])|([^\s.,:;!?()"'\n]+)/g;
            let tokens = [];
            let match;
            let quoteOpen = false;

            while ((match = regex.exec(text)) !== null) {
                if (match[1]) {
                    let char = match[1];
                    let spoken = "";
                    if(char === ',') spoken = "coma";
                    else if(char === '.') spoken = "punto";
                    else if(char === '\n') spoken = "punto y aparte";
                    else if(char === ':') spoken = "dos puntos";
                    else if(char === ';') spoken = "punto y coma";
                    else if(char === '!') spoken = "signo de admiración";
                    else if(char === '¡') spoken = "abrimos admiración";
                    else if(char === '?') spoken = "signo de interrogación";
                    else if(char === '¿') spoken = "abrimos interrogación";
                    else if(char === '(') spoken = "abrimos paréntesis";
                    else if(char === ')') spoken = "cerramos paréntesis";
                    else if(char === '"' || char === "'") {
                        spoken = quoteOpen ? "cerramos comillas" : "abrimos comillas";
                        quoteOpen = !quoteOpen;
                    }
                    if(spoken) tokens.push({ type: 'punct', raw: char, spoken: spoken });
                } else if (match[2]) {
                    tokens.push({ type: 'word', raw: match[2], spoken: match[2] });
                }
            }
            
            // Post-proceso para "punto seguido" vs "punto y aparte"
            for(let i=0; i<tokens.length; i++) {
                if(tokens[i].raw === '.') {
                    let isBreak = false;
                    for(let j=i+1; j<tokens.length; j++) {
                        if(tokens[j].type === 'word') break;
                        if(tokens[j].raw === '\n') { isBreak = true; break; }
                    }
                    tokens[i].spoken = isBreak ? "punto y aparte" : "punto seguido";
                }
            }
            return tokens;
        }

        function createChunks(tokens, wordsPerChunk) {
            let result = [];
            let currentTokens = [];
            let wordCount = 0;

            for (let token of tokens) {
                if (token.raw === '\n') continue; // Omitir enters visuales
                currentTokens.push(token);
                if (token.type === 'word') wordCount++;

                if (wordCount >= wordsPerChunk) {
                    result.push(currentTokens);
                    currentTokens = [];
                    wordCount = 0;
                }
            }
            if (currentTokens.length > 0) result.push(currentTokens);
            return result;
        }

        // Renderizar Tarjetas
        function renderChunks() {
            const container = document.getElementById('chunksContainer');
            container.innerHTML = '';
            chunks.forEach((chunkTokens, index) => {
                const div = document.createElement('div');
                div.className = 'p-4 rounded-xl border cursor-pointer hover:shadow-md transition-all bg-gray-50 dark:bg-dark-bg dark:border-dark-border';
                div.id = `chunk-${index}`;
                
                // Mostrar texto visual normal
                div.innerText = chunkTokens.map(t => t.raw).join(' ').replace(/\s+([.,;:!?])/g, '$1');
                
                div.onclick = () => {
                    // Forzar el inicio desde este bloque, sin importar si estaba leyendo
                    stopDictation(); 
                    
                    // Pequeña pausa para que el motor limpie la voz anterior
                    setTimeout(() => {
                        currentChunkIndex = index;
                        document.getElementById('btnStop').classList.remove('hidden');
                        startDictation();
                    }, 100);
                };
                container.appendChild(div);
            });
            
            // En pantallas grandes, la vista de reproducción ya está en su propia columna
            document.getElementById('playbackView').classList.remove('hidden');
        }

        document.getElementById('btnProcess').onclick = () => {
            const text = document.getElementById('inputText').value;
            if(!text) return;
            const wpc = parseInt(document.getElementById('cfgWords').value);
            const tokens = tokenize(text);
            chunks = createChunks(tokens, wpc);
            renderChunks();
            
            // Ya no ocultamos el área de texto original en este diseño
            // document.getElementById('inputText').classList.add('hidden'); 
            
            document.getElementById('btnProcess').classList.add('hidden');
            document.getElementById('btnStop').classList.remove('hidden');
        };

        // Función de pausa rediseñada que congela el bucle
        const sleep = ms => new Promise(resolve => {
            let timePassed = 0;
            const interval = 50; // Chequeo constante del estado
            
            globalTimer = setInterval(() => {
                if (!isPaused) {
                    timePassed += interval;
                    if (timePassed >= ms) {
                        clearInterval(globalTimer);
                        resolve();
                    }
                }
            }, interval);
        });

        // Leer una sola palabra
        function speakWord(text) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voiceIdx = document.getElementById('voiceSelect').value;
                if(voices[voiceIdx]) utterance.voice = voices[voiceIdx];
                
                // LECTURA DINAMICA DE VOLUMEN Y VELOCIDAD JUSTO ANTES DE HABLAR
                utterance.volume = parseFloat(document.getElementById('cfgVolume').value);
                utterance.rate = parseFloat(document.getElementById('cfgRate').value);

                utterance.onend = resolve;
                synth.speak(utterance);
            });
        }

        // Bucle Principal
        async function startDictation() {
            isPlaying = true;
            isPaused = false;
            document.getElementById('btnPause').classList.remove('hidden');
            document.getElementById('btnPause').innerText = "Pausar";
            
            const repeats = parseInt(document.getElementById('cfgRepeats').value);
            
            while (currentChunkIndex < chunks.length && isPlaying) {
                // Resaltar
                document.querySelectorAll('#chunksContainer > div').forEach(d => d.classList.remove('active-chunk', 'border-blue-500'));
                const el = document.getElementById(`chunk-${currentChunkIndex}`);
                if(el) {
                    el.classList.add('active-chunk', 'border-blue-500');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

                const chunkTokens = chunks[currentChunkIndex];
                
                for(let r = 0; r < repeats; r++) {
                    if(!isPlaying) break;
                    
                    // Esperar si está pausado antes de empezar repetición
                    while(isPaused) await sleep(100);

                    // Leer tokens del bloque respetando la pausa entre palabras
                    for(let i=0; i < chunkTokens.length; i++) {
                        if(!isPlaying) break;
                        while(isPaused) await sleep(100); // Hibernar

                        await speakWord(chunkTokens[i].spoken);
                        
                        // Pausa entre palabras (si no es la última)
                        if(i < chunkTokens.length -1) {
                            const pWord = parseFloat(document.getElementById('cfgPauseWord').value) * 1000;
                            if(pWord > 0) await sleep(pWord);
                        }
                    }

                    // Pausa entre repeticiones (si no es la última repetición)
                    if(r < repeats - 1 && isPlaying) {
                        const pSent = parseFloat(document.getElementById('cfgPauseSentence').value) * 1000;
                        await sleep(pSent);
                    }
                }
                
                currentChunkIndex++;
                // Pausa antes de pasar al siguiente bloque
                if(currentChunkIndex < chunks.length && isPlaying) {
                     const pSent = parseFloat(document.getElementById('cfgPauseSentence').value) * 1000;
                     await sleep(pSent);
                }
            }
            
            if (isPlaying) {
                stopDictation();
            }
        }

        // Botón Pausa/Continuar
        document.getElementById('btnPause').onclick = () => {
            if(isPaused) {
                // Reanudar
                isPaused = false;
                synth.resume();
                document.getElementById('btnPause').innerText = "Pausar";
                document.getElementById('btnPause').classList.replace('bg-green-500', 'bg-yellow-500');
            } else {
                // Pausar
                isPaused = true;
                synth.pause();
                document.getElementById('btnPause').innerText = "Continuar";
                document.getElementById('btnPause').classList.replace('bg-yellow-500', 'bg-green-500');
            }
        };

        function stopDictation() {
            isPlaying = false;
            isPaused = false;
            if(globalTimer) clearInterval(globalTimer);
            synth.cancel();
            document.querySelectorAll('#chunksContainer > div').forEach(d => d.classList.remove('active-chunk', 'border-blue-500'));
            
            document.getElementById('btnPause').classList.add('hidden');
            document.getElementById('btnPause').innerText = "Pausar";
            document.getElementById('btnPause').classList.replace('bg-green-500', 'bg-yellow-500');
        }

        document.getElementById('btnStop').onclick = () => {
            stopDictation();
            // document.getElementById('inputText').classList.remove('hidden');
            document.getElementById('playbackView').classList.add('hidden');
            document.getElementById('btnProcess').classList.remove('hidden');
            document.getElementById('btnStop').classList.add('hidden');
            currentChunkIndex = 0;
        };

        // --- Seguridad Anti-Inspección Básica ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
        }
    </script>
</body>
</html>
